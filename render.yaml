services:
  - type: web
    name: sendpay-api
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__Key
        sync: false
      - key: Jwt__Issuer
        value: SendPay.Api
      - key: Jwt__Audience
        value: SendPay.Client
      # OTP: Production yêu cầu Email, Sms hoặc Both (không dùng Log). Thêm Otp__Email__* hoặc Otp__Sms__* trong dashboard nếu cần.
      - key: Otp__DeliveryMode
        sync: false
      - key: Otp__Pepper
        sync: false
