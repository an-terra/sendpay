name: CD - Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wait-for-ci:
    name: Chờ CI pass
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI workflow
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: "Build & Test (.NET 10.0.x)"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15
          allowed-conclusions: success

  deploy:
    name: Trigger Render Deploy
    runs-on: ubuntu-latest
    needs: wait-for-ci
    environment:
      name: production
      url: ${{ vars.RENDER_SERVICE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Thiếu secret RENDER_DEPLOY_HOOK_URL"
            exit 1
          fi
          echo "Đang gọi Render deploy hook..."
          response=$(curl -s -o /tmp/render.json -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
          echo "HTTP $response"
          cat /tmp/render.json || true
          if [ "$response" -ge 400 ]; then
            echo "::error::Render trả về lỗi $response"
            exit 1
          fi

      - name: Đợi service Render khởi động
        if: ${{ vars.RENDER_SERVICE_URL != '' }}
        env:
          SERVICE_URL: ${{ vars.RENDER_SERVICE_URL }}
        run: |
          echo "Health-check tại $SERVICE_URL/scalar ..."
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$SERVICE_URL/scalar" || echo 000)
            echo "Lần $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Service đã sẵn sàng."
              exit 0
            fi
            sleep 20
          done
          echo "::warning::Service chưa trả 200 sau 10 phút, kiểm tra log Render."
