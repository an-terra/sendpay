name: CI - Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  build-test:
    name: Build & Test (.NET ${{ matrix.dotnet }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dotnet: ["10.0.x"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ matrix.dotnet }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore SendPay.Api
        run: dotnet restore SendPay.Api/SendPay.Api.csproj

      - name: Restore SendPay.Web
        run: dotnet restore SendPay.Web/SendPay.Web.csproj

      - name: Build SendPay.Api (Release)
        run: dotnet build SendPay.Api/SendPay.Api.csproj -c Release --no-restore

      - name: Build SendPay.Web (Release)
        run: dotnet build SendPay.Web/SendPay.Web.csproj -c Release --no-restore

      - name: Run tests (nếu có)
        run: |
          if ls **/*Tests*.csproj 2>/dev/null | grep -q .; then
            dotnet test --configuration Release --no-build --verbosity normal
          else
            echo "Không tìm thấy project test, bỏ qua bước này."
          fi

  docker-build:
    name: Docker Build (smoke test)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: sendpay:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
