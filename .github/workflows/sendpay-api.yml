name: Build SendPay.Api

on:
  push:
    branches: [main, master]
    paths:
      - 'SendPay.Api/**'
      - '.github/workflows/sendpay-api.yml'
  pull_request:
    paths:
      - 'SendPay.Api/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore SendPay.Api/SendPay.Api.csproj
      - name: Build
        run: dotnet build SendPay.Api/SendPay.Api.csproj -c Release --no-restore
